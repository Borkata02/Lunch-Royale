<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunch Royale ⚔️ TCG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-anim { animation: slideUp 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 text-center">
    <h1 class="text-3xl font-black text-amber-400 mb-2">LUNCH ROYALE ⚔️</h1>
    <p class="text-slate-400 text-sm mb-6">Битката за обяд в офиса</p>

    <!-- ЕКРАН 1: ВХОД -->
    <div id="screen-setup" class="space-y-4">
      <input id="username" type="text" placeholder="Твоето име..." class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400 text-center font-bold">
      
      <div class="flex items-center justify-center space-x-2 py-2">
        <input id="treat-mode" type="checkbox" class="w-5 h-5 accent-amber-400">
        <label for="treat-mode" class="text-sm font-semibold text-amber-300">👑 Днес аз черпя (Treat Mode)</label>
      </div>

      <button onclick="createLobby()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition">Създай Лоби (Host)</button>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-slate-500 text-xs">ИЛИ</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="flex space-x-2">
        <input id="lobby-code-input" type="text" placeholder="КОД (напр. 1234)" class="w-1/2 p-3 rounded-xl bg-slate-700 border border-slate-600 text-center uppercase font-mono">
        <button onclick="joinLobby()" class="w-1/2 py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition">Влез (Join)</button>
      </div>
    </div>

    <!-- ЕКРАН 2: ЛОБИ -->
    <div id="screen-lobby" class="hidden space-y-4">
      <div class="bg-slate-700/50 p-3 rounded-xl border border-slate-600 flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-400 block text-left">КОД ЗА ВЛИЗАНЕ:</span>
          <span id="display-code" class="text-2xl font-mono font-black text-amber-400 tracking-widest">----</span>
        </div>
        <div id="treat-banner" class="hidden bg-amber-500/20 text-amber-300 px-3 py-1 rounded-lg text-xs font-bold border border-amber-500/30">
          👑 Черпят ни!
        </div>
      </div>

      <div class="text-left space-y-1">
        <label class="text-xs font-bold text-slate-400 uppercase">Изберете режим на битка:</label>
        <div class="grid grid-cols-3 gap-2">
          <button id="mode-vote" onclick="selectGameMode('vote')" class="mode-btn p-2 rounded-xl bg-slate-700 border-2 border-amber-400 text-xs font-bold text-center transition">🗳️ Гласуване</button>
          <button id="mode-wheel" onclick="selectGameMode('wheel')" class="mode-btn p-2 rounded-xl bg-slate-700 border-2 border-transparent text-xs font-bold text-center transition">🎡 Колело</button>
          <button id="mode-tournament" onclick="selectGameMode('tournament')" class="mode-btn p-2 rounded-xl bg-slate-700 border-2 border-transparent text-xs font-bold text-center transition">⚔️ Турнир</button>
        </div>
      </div>

      <div class="text-left">
        <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase">Колеги в лобито:</h3>
        <ul id="players-list" class="space-y-2"></ul>
      </div>

      <div id="turn-indicator" class="hidden bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-xs font-bold text-amber-300 text-center animate-pulse">
        ⏳ На ход е: <span id="current-turn-player">...</span>
      </div>

      <div class="space-y-2 pt-2 border-t border-slate-700 text-left">
        <label class="text-xs font-bold text-slate-400 uppercase">Предложения за обяд (Карти):</label>
        <div class="flex space-x-2">
          <input id="suggestion-input" type="text" placeholder="напр. Дюнери, Суши..." class="flex-1 p-2.5 rounded-lg bg-slate-700 border border-slate-600 text-sm focus:outline-none focus:border-amber-400">
          <button id="add-btn" onclick="submitSuggestion()" class="px-4 bg-slate-600 hover:bg-slate-500 text-xs font-bold rounded-lg transition">Добави</button>
        </div>
        <div id="suggestions-container" class="flex flex-wrap gap-1.5 pt-1 min-h-[30px]">
          <span class="text-xs text-slate-500 italic">Все още няма добавени места...</span>
        </div>
      </div>

      <button id="start-btn" onclick="startGame()" class="hidden w-full py-3 bg-green-500 hover:bg-green-600 text-slate-950 font-bold rounded-xl transition">ЗАПОЧНИ ПОДГОТОВКАТА 🚀</button>
    </div>

    <!-- ЕКРАН 3: ГЛАСУВАНЕ / АРЕНА / НАСТРОЙКА -->
    <div id="screen-game" class="hidden space-y-4">
      <h2 id="game-title" class="text-xl font-bold text-amber-400">Заглавие</h2>
      <div id="options-list" class="space-y-3"></div>
    </div>

    <!-- ЕКРАН 4: ПОБЕДИТЕЛ -->
    <div id="screen-winner" class="hidden space-y-4 py-6">
      <span class="text-5xl block animate-bounce">🏆</span>
      <h2 class="text-sm font-bold text-slate-400 uppercase">Днешният победител е:</h2>
      <div id="winner-name" class="text-3xl font-black text-amber-400 tracking-wide">...</div>
    </div>

  </div>

  <script>
    let peer = null;
    let connections = [];
    let isHost = false;
    let myName = '';
    let hostConn = null;

    let players = []; // { name, isHost, ready }
    let suggestions = []; // { text, author }
    let selectedMode = 'vote';
    let currentTurnIndex = 0;

    // TCG локални данни за играча
    let myCards = [];
    let activeCardIndex = 0;
    let pointsPerCard = 10;
    let currentMaxPoints = 10;
    let remainingPoints = 10;
    let cardStats = { taste: 0, speed: 0, value: 0 };
    let configuredCards = [];

    function showToast(message, icon = '✨') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-anim bg-slate-800 text-white border border-slate-700 shadow-2xl px-4 py-3 rounded-xl flex items-center space-x-2 text-sm font-bold';
      toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function createLobby() {
      myName = document.getElementById('username').value.trim();
      if (!myName) return showToast('Въведи име!', '⚠️');

      const code = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('lunch-' + code);

      peer.on('open', () => {
        isHost = true;
        showLobby(code);
        players = [{ name: myName, isHost: true, ready: false }];
        updatePlayersUI(players);
        document.getElementById('start-btn').classList.remove('hidden');
        showToast('Лобито е създадено!', '🎉');
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleHostData(data, conn));
      });
    }

    function joinLobby() {
      myName = document.getElementById('username').value.trim();
      const code = document.getElementById('lobby-code-input').value.trim();
      if (!myName || !code) return showToast('Попълни име и код!', '⚠️');

      peer = new Peer();
      peer.on('open', () => {
        hostConn = peer.connect('lunch-' + code);
        hostConn.on('open', () => {
          hostConn.send({ type: 'JOIN', name: myName });
          showLobby(code);
          showToast('Успешно влезе в лобито!', '👋');
        });
        hostConn.on('data', handleClientData);
      });
    }

    function showLobby(code) {
      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
      document.getElementById('display-code').innerText = code;
      if (document.getElementById('treat-mode').checked) {
        document.getElementById('treat-banner').classList.remove('hidden');
      }
    }

    function selectGameMode(mode) {
      if (!isHost) return showToast('Само Хостът може да сменя режима!', '🔒');
      selectedMode = mode;
      updateGameModeUI(mode);
      broadcast({ type: 'MODE_CHANGE', mode: mode, turnIndex: currentTurnIndex });
    }

    function updateGameModeUI(mode) {
      selectedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.replace('border-amber-400', 'border-transparent'));
      document.getElementById('mode-' + mode).classList.replace('border-transparent', 'border-amber-400');

      const turnInd = document.getElementById('turn-indicator');
      if (mode === 'tournament') {
        turnInd.classList.remove('hidden');
        updateTurnUI();
      } else {
        turnInd.classList.add('hidden');
      }
    }

    function updatePlayersUI(list) {
      const ul = document.getElementById('players-list');
      ul.innerHTML = list.map(p => `
        <li class="bg-slate-700 p-2.5 rounded-lg text-sm font-semibold flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span>${p.name}</span>
            ${p.ready ? '<span class="text-[10px] bg-green-500/20 text-green-300 px-1.5 py-0.5 rounded border border-green-500/30">ГОТОВ</span>' : ''}
          </div>
          ${p.isHost ? '<span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">HOST</span>' : ''}
        </li>
      `).join('');
    }

    function updateTurnUI() {
      if (players.length === 0) return;
      const currentPlayer = players[currentTurnIndex % players.length].name;
      document.getElementById('current-turn-player').innerText = currentPlayer;
    }

    function submitSuggestion() {
      const input = document.getElementById('suggestion-input');
      const val = input.value.trim();
      if (!val) return;

      if (selectedMode === 'tournament') {
        if (players.length === 0) return;
        const activePlayer = players[currentTurnIndex % players.length].name;
        
        if (myName.trim().toLowerCase() !== activePlayer.trim().toLowerCase()) {
          showToast(`Не си на ход! Чакай ${activePlayer}`, '⏳');
          return;
        }
      }

      if (isHost) {
        processAddSuggestion(val, myName);
      } else {
        hostConn.send({ type: 'SUGGESTION', value: val, author: myName });
      }
      input.value = '';
    }

    function processAddSuggestion(val, author) {
      const normalized = val.toLowerCase().trim();
      const exists = suggestions.some(s => s.text.toLowerCase().trim() === normalized);

      if (exists) {
        if (author === myName) showToast(`"${val}" вече съществува!`, '⚠️');
        return;
      }

      suggestions.push({ text: val, author: author });
      if (selectedMode === 'tournament') {
        currentTurnIndex++;
      }

      broadcast({ type: 'SUGGESTION_LIST', suggestions, addedBy: author, newItem: val, turnIndex: currentTurnIndex });
      updateSuggestionsUI(suggestions);
      if (selectedMode === 'tournament') updateTurnUI();
      showToast(`${author} добави карта: "${val}"`, '🃏');
    }

    function removeSuggestion(index) {
      if (!isHost) return;
      const removed = suggestions.splice(index, 1);
      broadcast({ type: 'SUGGESTION_LIST', suggestions, turnIndex: currentTurnIndex });
      updateSuggestionsUI(suggestions);
      showToast(`Хостът премахна предложен пункт`, '🗑️');
    }

    function updateSuggestionsUI(list) {
      const container = document.getElementById('suggestions-container');
      if (list.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500 italic">Все още няма добавени места...</span>`;
        return;
      }
      container.innerHTML = list.map((s, idx) => `
        <span class="bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1.5">
          📍 ${s.text} <span class="text-[10px] opacity-60">(${s.author})</span>
          ${isHost ? `<button onclick="removeSuggestion(${idx})" class="text-red-400 hover:text-red-300 font-bold ml-1">✕</button>` : ''}
        </span>
      `).join('');
    }

    function startGame() {
      if (suggestions.length === 0) return showToast('Добавете поне 1 карта!', '⚠️');
      broadcast({ type: 'START_GAME', options: suggestions, mode: selectedMode });
      renderGameUI(suggestions, selectedMode);
    }

    function handleHostData(data, conn) {
      if (data.type === 'JOIN') {
        players.push({ name: data.name, isHost: false, ready: false });
        updatePlayersUI(players);
        if (selectedMode === 'tournament') updateTurnUI();
        
        broadcast({ 
          type: 'SYNC_ALL', 
          players: players, 
          suggestions: suggestions, 
          mode: selectedMode, 
          turnIndex: currentTurnIndex 
        });
        showToast(`${data.name} се присъедини!`, '👋');
      } else if (data.type === 'SUGGESTION') {
        processAddSuggestion(data.value, data.author);
      } else if (data.type === 'PLAYER_READY') {
        const player = players.find(p => p.name.trim().toLowerCase() === data.name.trim().toLowerCase());
        if (player) player.ready = true;
        
        broadcast({ type: 'PLAYER_LIST', players });
        updatePlayersUI(players);
        checkAllReadyStatus();
      }
    }

    function handleClientData(data) {
      if (data.type === 'SYNC_ALL') {
        players = data.players;
        suggestions = data.suggestions;
        currentTurnIndex = data.turnIndex;
        updatePlayersUI(players);
        updateSuggestionsUI(suggestions);
        updateGameModeUI(data.mode);
      } else if (data.type === 'PLAYER_LIST') {
        players = data.players;
        updatePlayersUI(players);
        checkAllReadyStatus();
      } else if (data.type === 'MODE_CHANGE') {
        updateGameModeUI(data.mode);
        if (data.turnIndex !== undefined) currentTurnIndex = data.turnIndex;
        updateTurnUI();
        showToast(`Хостът избра режим: ${data.mode}`, '🎮');
      } else if (data.type === 'SUGGESTION_LIST') {
        suggestions = data.suggestions;
        if (data.turnIndex !== undefined) currentTurnIndex = data.turnIndex;
        updateSuggestionsUI(suggestions);
        updateTurnUI();
        if (data.newItem) showToast(`${data.addedBy} добави: "${data.newItem}"`, '🃏');
      } else if (data.type === 'START_GAME') {
        renderGameUI(data.options, data.mode);
      } else if (data.type === 'START_BATTLE') {
        startActualBattle();
      }
    }

    function broadcast(data) {
      connections.forEach(c => c.send(data));
    }

    // ТУРНИРНА ЛОГИКА & НАСТРОЙКА НА КАРТИТЕ
    function renderGameUI(options, mode) {
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      
      const list = document.getElementById('options-list');
      if (mode === 'tournament') {
        // 1. Извличаме САМО картите, които този играч е написал!
        myCards = options.filter(s => s.author.trim().toLowerCase() === myName.trim().toLowerCase()).map(s => s.text);
        
        // Ако играчът няма собствени карти, взима случайни или общи
        if (myCards.length === 0) {
          showToast('Нямаш свои карти, получаваш общи предложения!', 'ℹ️');
          myCards = options.map(s => s.text);
        }

        // 2. БАЛАНС: Общият бюджет точки е 40. Изчисляваме точки на карта
        const TOTAL_BUDGET = 40;
        pointsPerCard = Math.floor(TOTAL_BUDGET / myCards.length);

        activeCardIndex = 0;
        configuredCards = [];
        renderCardSetup();
      } else {
        document.getElementById('game-title').innerText = 'Изберете какво ви се яде:';
        list.innerHTML = options.map(opt => `
          <button onclick="declareWinner('${opt.text}')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-xl transition">${opt.text}</button>
        `).join('');
      }
    }

    function renderCardSetup() {
      // Когато настройката на всички карти приключи -> Показваме "Изчакващ екран"
      if (activeCardIndex >= myCards.length) {
        setPlayerReady();
        return;
      }

      const cardName = myCards[activeCardIndex];
      currentMaxPoints = pointsPerCard;
      remainingPoints = pointsPerCard;
      cardStats = { taste: 0, speed: 0, value: 0 };

      document.getElementById('game-title').innerText = `🃏 Настройка (${activeCardIndex + 1}/${myCards.length})`;
      
      document.getElementById('options-list').innerHTML = `
        <div class="bg-slate-700/60 p-4 rounded-xl border border-amber-400/30 text-left space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-lg font-black text-amber-300">📍 ${cardName}</h3>
            <span class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-md border border-amber-500/30 font-bold">
              Остават: <span id="pts-left">${currentMaxPoints}</span> т.
            </span>
          </div>

          <div class="space-y-3">
            <div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span>🍔 Вкус (Taste)</span>
                <span id="val-taste">0</span>
              </div>
              <input type="range" min="0" max="${currentMaxPoints}" value="0" oninput="updateStat('taste', this.value)" class="w-full accent-amber-400 bg-slate-600">
            </div>

            <div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span>⏱️ Бързина (Speed)</span>
                <span id="val-speed">0</span>
              </div>
              <input type="range" min="0" max="${currentMaxPoints}" value="0" oninput="updateStat('speed', this.value)" class="w-full accent-amber-400 bg-slate-600">
            </div>

            <div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span>💰 Изгодна цена (Value)</span>
                <span id="val-value">0</span>
              </div>
              <input type="range" min="0" max="${currentMaxPoints}" value="0" oninput="updateStat('value', this.value)" class="w-full accent-amber-400 bg-slate-600">
            </div>
          </div>

          <button onclick="confirmCard()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg transition text-sm">
            Запази картата (${pointsPerCard}т.) ➡️
          </button>
        </div>
      `;
    }

    function updateStat(stat, value) {
      val = parseInt(value);
      const currentOtherSum = Object.keys(cardStats).reduce((acc, k) => k === stat ? acc : acc + cardStats[k], 0);
      
      if (val + currentOtherSum > currentMaxPoints) {
        val = currentMaxPoints - currentOtherSum;
      }
      
      cardStats[stat] = val;
      remainingPoints = currentMaxPoints - (currentOtherSum + val);

      document.getElementById('pts-left').innerText = remainingPoints;
      document.getElementById('val-' + stat).innerText = val;
    }

    function confirmCard() {
      if (remainingPoints > 0) {
        return showToast(`Разпредели всички ${currentMaxPoints} точки! Остават ${remainingPoints}`, '⚠️');
      }
      configuredCards.push({ name: myCards[activeCardIndex], stats: {...cardStats} });
      activeCardIndex++;
      renderCardSetup();
    }

    // СТЕЙТ "ГОТОВ"
    function setPlayerReady() {
      if (isHost) {
        const p = players.find(p => p.name.trim().toLowerCase() === myName.trim().toLowerCase());
        if (p) p.ready = true;
        broadcast({ type: 'PLAYER_LIST', players });
        updatePlayersUI(players);
      } else {
        hostConn.send({ type: 'PLAYER_READY', name: myName });
      }

      renderWaitingLobbyUI();
    }

    function renderWaitingLobbyUI() {
      document.getElementById('game-title').innerText = '⏳ Очакване на колегите...';
      
      let hostLaunchBtnHTML = '';
      if (isHost) {
        hostLaunchBtnHTML = `
          <button id="host-battle-btn" onclick="hostLaunchBattle()" disabled class="w-full py-3 bg-slate-600 text-slate-400 cursor-not-allowed font-bold rounded-xl transition mt-4">
            ЗАПОЧНИ БИТКАТА ⚔️ (Очакват се всички)
          </button>
        `;
      }

      document.getElementById('options-list').innerHTML = `
        <div class="bg-slate-700/50 p-5 rounded-xl border border-slate-600 space-y-3 text-left">
          <p class="text-xs font-bold text-amber-300 uppercase tracking-wider text-center">Готовност на играчите:</p>
          <ul id="ready-players-list" class="space-y-2"></ul>
          ${hostLaunchBtnHTML}
        </div>
      `;

      updateReadyListUI();
      checkAllReadyStatus();
    }

    function updateReadyListUI() {
      const container = document.getElementById('ready-players-list');
      if (!container) return;
      
      container.innerHTML = players.map(p => `
        <li class="bg-slate-800 p-2.5 rounded-lg text-xs font-bold flex justify-between items-center border border-slate-700">
          <span>${p.name}</span>
          ${p.ready ? '<span class="text-green-400 flex items-center gap-1">✅ Готов</span>' : '<span class="text-amber-400 flex items-center gap-1 animate-pulse">⏳ Настройва...</span>'}
        </li>
      `).join('');
    }

    function checkAllReadyStatus() {
      updateReadyListUI();
      
      const allReady = players.length > 0 && players.every(p => p.ready);
      
      if (isHost) {
        const btn = document.getElementById('host-battle-btn');
        if (btn) {
          if (allReady) {
            btn.disabled = false;
            btn.className = "w-full py-3 bg-green-500 hover:bg-green-600 text-slate-950 font-black rounded-xl transition shadow-lg animate-bounce cursor-pointer";
            btn.innerText = "ЗАПОЧНИ БИТКАТА ⚔️";
          } else {
            btn.disabled = true;
            btn.className = "w-full py-3 bg-slate-600 text-slate-400 cursor-not-allowed font-bold rounded-xl transition mt-4";
            btn.innerText = "ЗАПОЧНИ БИТКАТА ⚔️ (Очакват се всички)";
          }
        }
      }
    }

    function hostLaunchBattle() {
      if (!isHost) return;
      broadcast({ type: 'START_BATTLE' });
      startActualBattle();
    }

    function startActualBattle() {
      document.getElementById('game-title').innerText = '⚔️ БИТКАТА ЗА ОБЯД ЗАПОЧНА!';
      
      // Показваме първата карта за битка
      const firstCard = configuredCards[0] ? configuredCards[0].name : "Дюнери";
      document.getElementById('options-list').innerHTML = `
        <div class="bg-slate-700 p-6 rounded-xl border-2 border-amber-400 text-center space-y-4">
          <span class="text-5xl block animate-pulse">⚔️</span>
          <h3 class="text-xl font-black text-amber-300">Първа Битка!</h3>
          <p class="text-sm font-semibold">Твоята бойна карта на арената: <br><strong class="text-amber-400 text-lg">${firstCard}</strong></p>
          <button onclick="declareWinner('${firstCard}')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition">
            Атакувай опонента! 🔥
          </button>
        </div>
      `;
    }

    function declareWinner(winner) {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-winner').classList.remove('hidden');
      document.getElementById('winner-name').innerText = winner;
    }
  </script>
</body>
</html>
